name: Build and Release Plexo

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: write

env:
  NODE_VERSION: "22.13.0"
  REPOSITORY: "ProAlit/plexo"

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-2025
            target: win

          - name: macOS
            os: macos-26
            target: mac

          - name: Linux
            os: ubuntu-24.04
            target: linux

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Show package version
        shell: bash
        run: |
          VERSION="$(node -p "require('./package.json').version")"

          echo "Package version: ${VERSION}"
          echo "Automatic release tag: v${VERSION}"

          {
            echo "VERSION=${VERSION}"
            echo "TAG=v${VERSION}"
          } >> "$GITHUB_ENV"

      - name: Install dependencies
        run: npm ci

      - name: Clean previous build
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');

          for (const dir of ['dist', 'release']) {
            fs.rmSync(dir, {
              recursive: true,
              force: true
            });
          }

          fs.mkdirSync('release', {
            recursive: true
          });
          NODE

      - name: Build ${{ matrix.target }}
        run: npm run build:${{ matrix.target }}

      - name: Collect release files
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = require('path');

          const dist = path.resolve('dist');
          const release = path.resolve('release');

          const allowed = /\.(dmg|pkg|exe|msi|appimage|deb|rpm|snap|pacman|zip|7z|tar\.gz|blockmap|yml|yaml|zsync|sig)$/i;

          if (!fs.existsSync(dist)) {
            throw new Error('dist directory does not exist.');
          }

          fs.mkdirSync(release, { recursive: true });

          const files = fs.readdirSync(dist, { withFileTypes: true })
            .filter(entry => entry.isFile())
            .map(entry => entry.name)
            .filter(name => allowed.test(name))
            .sort();

          if (files.length === 0) {
            throw new Error(
              'No packaged release files were found in dist/.'
            );
          }

          for (const file of files) {
            fs.copyFileSync(
              path.join(dist, file),
              path.join(release, file)
            );
          }

          console.log('Release files:');
          for (const file of files) {
            console.log(`  ${file}`);
          }
          NODE

      - name: Verify release files
        shell: bash
        run: |
          echo "Collected files:"
          ls -lah release

          count="$(find release -maxdepth 1 -type f | wc -l)"

          if [ "$count" -eq 0 ]; then
            echo "ERROR: No release files found."
            exit 1
          fi

          echo "Total release files: ${count}"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: plexo-${{ matrix.name }}-${{ github.sha }}
          path: release/*
          if-no-files-found: error
          retention-days: 7

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Determine version and automatic tag
        id: version
        shell: bash
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          TAG="v${VERSION}"

          if [ -z "$VERSION" ]; then
            echo "ERROR: Could not read version from package.json."
            exit 1
          fi

          echo "Package version : ${VERSION}"
          echo "Release tag     : ${TAG}"

          {
            echo "version=${VERSION}"
            echo "tag=${TAG}"
          } >> "$GITHUB_OUTPUT"

      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: plexo-Windows-${{ github.sha }}
          path: artifacts/windows

      - name: Download macOS artifact
        uses: actions/download-artifact@v4
        with:
          name: plexo-macOS-${{ github.sha }}
          path: artifacts/macos

      - name: Download Linux artifact
        uses: actions/download-artifact@v4
        with:
          name: plexo-Linux-${{ github.sha }}
          path: artifacts/linux

      - name: Prepare release assets
        shell: bash
        run: |
          rm -rf upload
          mkdir -p upload

          cp artifacts/windows/* upload/ 2>/dev/null || true
          cp artifacts/macos/* upload/2>/dev/null || true
          cp artifacts/linux/* upload/2>/dev/null || true

          echo "Final release assets:"
          ls -lah upload

          shopt -s nullglob
          files=(upload/*)

          if [ "${#files[@]}" -eq 0 ]; then
            echo "ERROR: No release assets were collected."
            exit 1
          fi

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
          TARGET_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "Plexo automatic release"
          echo "========================================"
          echo "Package version : ${VERSION}"
          echo "Release tag     : ${TAG}"
          echo "Commit          : ${TARGET_SHA}"
          echo "========================================"

          shopt -s nullglob
          ASSETS=(upload/*)

          if [ "${#ASSETS[@]}" -eq 0 ]; then
            echo "ERROR: No assets found."
            exit 1
          fi

          # Determine whether this is a prerelease.
          PRERELEASE_ARGS=()

          case "${VERSION}" in
            *-alpha*|*-beta*|*-rc*)
              PRERELEASE_ARGS+=(--prerelease)
              echo "Release type    : PRE-RELEASE"
              ;;
            *)
              echo "Release type    : STABLE"
              ;;
          esac

          # If the release already exists, upload/replace its assets.
          if gh release view "${TAG}" --repo "${REPOSITORY}" >/dev/null 2>&1; then
            echo "Release ${TAG} already exists."
            echo "Updating existing release assets..."

            gh release upload \
              "${TAG}" \
              "${ASSETS[@]}" \
              --repo "${REPOSITORY}" \
              --clobber

          else
            echo "Release ${TAG} does not exist."
            echo "Creating release..."

            gh release create \
              "${TAG}" \
              "${ASSETS[@]}" \
              --repo "${REPOSITORY}" \
              --target "${TARGET_SHA}" \
              --title "Plexo ${TAG}" \
              --generate-notes \
              "${PRERELEASE_ARGS[@]}"
          fi

          echo
          echo "Release completed successfully:"
          echo "https://github.com/${REPOSITORY}/releases/tag/${TAG}"
