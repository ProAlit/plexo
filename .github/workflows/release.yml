name: Plexo Release

on:
  push:
    tags:
      - "v*"

  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag, for example v1.0.0 or v1.0.0-rc.11"
        required: true
        type: string

      source_ref:
        description: "Branch, tag, or commit to build from"
        required: true
        default: "main"
        type: string

permissions:
  contents: write

concurrency:
  group: plexo-release-${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
  cancel-in-progress: false


jobs:

  # ============================================================
  # BUILD
  # ============================================================

  build:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false

      matrix:
        include:

          - platform: Windows
            os: windows-latest
            target: win
            artifact_name: plexo-windows
            output_dir: release/windows

          - platform: macOS
            os: macos-latest
            target: mac
            artifact_name: plexo-macos
            output_dir: release/macos

          - platform: Linux
            os: ubuntu-latest
            target: linux
            artifact_name: plexo-linux
            output_dir: release/linux


    steps:

      # ----------------------------------------------------------
      # CHECKOUT
      # ----------------------------------------------------------

      - name: Checkout source
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.source_ref || github.ref }}
          fetch-depth: 0


      # ----------------------------------------------------------
      # NODE
      # ----------------------------------------------------------

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22.13.0"
          cache: npm


      # ----------------------------------------------------------
      # INSTALL
      # ----------------------------------------------------------

      - name: Install dependencies
        run: npm ci


      # ----------------------------------------------------------
      # PACKAGE VERSION
      # ----------------------------------------------------------

      - name: Read package version
        shell: bash
        run: |
          PACKAGE_VERSION=$(node -p "require('./package.json').version")

          echo "Package version: ${PACKAGE_VERSION}"

          if [ -z "${PACKAGE_VERSION}" ]; then
            echo "ERROR: Could not determine package version."
            exit 1
          fi

          echo "PACKAGE_VERSION=${PACKAGE_VERSION}" >> "$GITHUB_ENV"


      # ----------------------------------------------------------
      # CLEAN
      # ----------------------------------------------------------

      - name: Clean build directories
        shell: bash
        run: |
          rm -rf dist
          rm -rf release

          mkdir -p "${{ matrix.output_dir }}"


      # ----------------------------------------------------------
      # BUILD
      # ----------------------------------------------------------

      - name: Build ${{ matrix.platform }}
        run: npm run build:${{ matrix.target }}


      # ----------------------------------------------------------
      # SHOW BUILD OUTPUT
      #
      # IMPORTANT:
      # Do not use GNU find -printf here.
      # macOS uses BSD find.
      # ----------------------------------------------------------

      - name: Show build output
        shell: bash
        run: |
          echo "========================================"
          echo "Build output"
          echo "========================================"

          find dist \
            -maxdepth 1 \
            -type f \
            -print \
            | sort || true


      # ----------------------------------------------------------
      # COLLECT ONLY DISTRIBUTABLE FILES
      # ----------------------------------------------------------

      - name: Collect release assets
        shell: bash
        run: |
          echo "========================================"
          echo "Collecting distributables"
          echo "========================================"

          find dist \
            -maxdepth 1 \
            -type f \
            \( \
              -name "*.exe" \
              -o -name "*.exe.blockmap" \
              -o -name "*.msi" \
              -o -name "*.msi.blockmap" \
              -o -name "*.appx" \
              -o -name "*.appx.blockmap" \
              -o -name "*.dmg" \
              -o -name "*.dmg.blockmap" \
              -o -name "*.pkg" \
              -o -name "*.zip" \
              -o -name "*.zip.blockmap" \
              -o -name "*.7z" \
              -o -name "*.7z.blockmap" \
              -o -name "*.AppImage" \
              -o -name "*.deb" \
              -o -name "*.rpm" \
              -o -name "*.snap" \
              -o -name "*.pacman" \
              -o -name "*.apk" \
              -o -name "*.p5p" \
              -o -name "*.tar.gz" \
              -o -name "*.tar.xz" \
              -o -name "*.tar.bz2" \
              -o -name "*.tar.zst" \
              -o -name "*.blockmap" \
              -o -name "*.yml" \
            \) \
            ! -name "builder-debug.yml" \
            ! -name "builder-effective-config.yaml" \
            -exec cp {} "${{ matrix.output_dir }}/" \;


      # ----------------------------------------------------------
      # VERIFY RELEASE ASSETS
      # ----------------------------------------------------------

      - name: Verify release assets
        shell: bash
        run: |
          echo "========================================"
          echo "Release assets for ${{ matrix.platform }}"
          echo "========================================"

          find "${{ matrix.output_dir }}" \
            -maxdepth 1 \
            -type f \
            -print \
            | sort

          COUNT=$(find "${{ matrix.output_dir }}" \
            -maxdepth 1 \
            -type f \
            | wc -l \
            | tr -d ' ')

          echo
          echo "Asset count: ${COUNT}"

          if [ "${COUNT}" -eq 0 ]; then
            echo
            echo "ERROR: No distributable release assets were found."
            echo
            echo "Full dist directory:"
            find dist -maxdepth 2 -type f -print
            exit 1
          fi


      # ----------------------------------------------------------
      # UPLOAD CLEAN ARTIFACT
      # ----------------------------------------------------------

      - name: Upload ${{ matrix.platform }} release
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.output_dir }}/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 3


  # ============================================================
  # RELEASE
  # ============================================================

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest

    steps:

      # ----------------------------------------------------------
      # CHECKOUT
      # ----------------------------------------------------------

      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.source_ref || github.ref }}
          fetch-depth: 0


      # ----------------------------------------------------------
      # DETERMINE TAG
      # ----------------------------------------------------------

      - name: Determine release tag
        id: release
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.release_tag }}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi

          echo "Release tag: ${TAG}"

          if [ -z "${TAG}" ]; then
            echo "ERROR: Release tag is empty."
            exit 1
          fi

          case "${TAG}" in
            v*)
              ;;
            *)
              echo "ERROR: Release tag must start with 'v'."
              echo "Example: v1.0.0 or v1.0.0-rc.11"
              exit 1
              ;;
          esac

          VERSION="${TAG#v}"

          if ! [[ "${VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-].+)?$ ]]; then
            echo "ERROR: Invalid semantic version:"
            echo "${TAG}"
            exit 1
          fi

          PACKAGE_VERSION=$(node -p "require('./package.json').version")

          echo "Package version: ${PACKAGE_VERSION}"
          echo "Release version: ${VERSION}"

          if [ "${PACKAGE_VERSION}" != "${VERSION}" ]; then
            echo
            echo "ERROR: Release tag does not match package.json."
            echo
            echo "package.json : ${PACKAGE_VERSION}"
            echo "release tag   : ${VERSION}"
            echo
            exit 1
          fi

          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"


      # ----------------------------------------------------------
      # DOWNLOAD WINDOWS
      # ----------------------------------------------------------

      - name: Download Windows release
        uses: actions/download-artifact@v8
        with:
          name: plexo-windows
          path: downloaded/windows


      # ----------------------------------------------------------
      # DOWNLOAD MACOS
      # ----------------------------------------------------------

      - name: Download macOS release
        uses: actions/download-artifact@v8
        with:
          name: plexo-macos
          path: downloaded/macos


      # ----------------------------------------------------------
      # DOWNLOAD LINUX
      # ----------------------------------------------------------

      - name: Download Linux release
        uses: actions/download-artifact@v8
        with:
          name: plexo-linux
          path: downloaded/linux


      # ----------------------------------------------------------
      # PREPARE FINAL RELEASE ASSETS
      # ----------------------------------------------------------

      - name: Prepare release assets
        shell: bash
        run: |
          rm -rf upload
          mkdir -p upload

          echo "========================================"
          echo "Windows assets"
          echo "========================================"

          find downloaded/windows \
            -maxdepth 1 \
            -type f \
            -print \
            | sort || true

          echo
          echo "========================================"
          echo "macOS assets"
          echo "========================================"

          find downloaded/macos \
            -maxdepth 1 \
            -type f \
            -print \
            | sort || true

          echo
          echo "========================================"
          echo "Linux assets"
          echo "========================================"

          find downloaded/linux \
            -maxdepth 1 \
            -type f \
            -print \
            | sort || true


          # ------------------------------------------------------
          # Copy only distributables
          # ------------------------------------------------------

          find downloaded \
            -type f \
            \( \
              -name "*.exe" \
              -o -name "*.exe.blockmap" \
              -o -name "*.msi" \
              -o -name "*.msi.blockmap" \
              -o -name "*.appx" \
              -o -name "*.appx.blockmap" \
              -o -name "*.dmg" \
              -o -name "*.dmg.blockmap" \
              -o -name "*.pkg" \
              -o -name "*.zip" \
              -o -name "*.zip.blockmap" \
              -o -name "*.7z" \
              -o -name "*.7z.blockmap" \
              -o -name "*.AppImage" \
              -o -name "*.deb" \
              -o -name "*.rpm" \
              -o -name "*.snap" \
              -o -name "*.pacman" \
              -o -name "*.apk" \
              -o -name "*.p5p" \
              -o -name "*.tar.gz" \
              -o -name "*.tar.xz" \
              -o -name "*.tar.bz2" \
              -o -name "*.tar.zst" \
              -o -name "*.blockmap" \
              -o -name "*.yml" \
            \) \
            ! -name "builder-debug.yml" \
            ! -name "builder-effective-config.yaml" \
            -exec cp {} upload/ \;


      # ----------------------------------------------------------
      # VERIFY FINAL RELEASE
      # ----------------------------------------------------------

      - name: Verify final release assets
        shell: bash
        run: |
          echo "========================================"
          echo "Final GitHub Release assets"
          echo "========================================"

          find upload \
            -maxdepth 1 \
            -type f \
            -print \
            | sort

          COUNT=$(find upload \
            -maxdepth 1 \
            -type f \
            | wc -l \
            | tr -d ' ')

          echo
          echo "Final asset count: ${COUNT}"

          if [ "${COUNT}" -eq 0 ]; then
            echo "ERROR: No release assets found."
            exit 1
          fi


      # ----------------------------------------------------------
      # RELEASE TYPE
      # ----------------------------------------------------------

      - name: Determine release type
        id: release_type
        shell: bash
        run: |
          TAG="${{ steps.release.outputs.tag }}"

          if [[ "${TAG}" =~ -(alpha|beta|rc)(\.|-|$) ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
            echo "Release type: prerelease"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
            echo "Release type: stable"
          fi


      # ----------------------------------------------------------
      # PUBLISH RELEASE
      # ----------------------------------------------------------

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
        shell: bash
        run: |
          echo "========================================"
          echo "Publishing Plexo ${TAG}"
          echo "========================================"

          if [ "${{ steps.release_type.outputs.prerelease }}" = "true" ]; then
            gh release create "${TAG}" \
              upload/* \
              --repo "ProAlit/plexo" \
              --title "Plexo ${TAG}" \
              --generate-notes \
              --prerelease
          else
            gh release create "${TAG}" \
              upload/* \
              --repo "ProAlit/plexo" \
              --title "Plexo ${TAG}" \
              --generate-notes
          fi

          echo
          echo "========================================"
          echo "Release published successfully"
          echo "========================================"

          echo "https://github.com/ProAlit/plexo/releases/tag/${TAG}"
