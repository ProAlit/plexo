name: Build and Release Plexo

on:
  push:
    tags:
      - "v*"

  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to rebuild and publish"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: plexo-release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: Windows
            os: windows-latest
            target: win
            artifact: plexo-windows

          - platform: macOS
            os: macos-latest
            target: mac
            artifact: plexo-macos

          - platform: Linux
            os: ubuntu-latest
            target: linux
            artifact: plexo-linux

    steps:
      - name: Checkout source
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Plexo
        run: npm run build:${{ matrix.target }}

      - name: Show build output
        shell: bash
        run: |
          echo "===== dist/ ====="
          find dist -maxdepth 2 -type f -print 2>/dev/null || true

      - name: Upload platform build
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: dist/**
          if-no-files-found: error
          compression-level: 0


  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download all platform builds
        uses: actions/download-artifact@v8
        with:
          pattern: plexo-*
          path: release-assets
          merge-multiple: true

      - name: Show release files
        shell: bash
        run: |
          echo "===== Release assets ====="
          find release-assets -type f -print

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        shell: bash
        run: |
          mapfile -t ASSETS < <(
            find release-assets \
              -type f \
              -not -name ".DS_Store" \
              -print
          )

          if [ "${#ASSETS[@]}" -eq 0 ]; then
            echo "No release assets found."
            exit 1
          fi

          echo "Creating release: ${TAG}"

          gh release create "${TAG}" \
            "${ASSETS[@]}" \
            --title "Plexo ${TAG}" \
            --generate-notes
